[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equipment-diagnostic-agent"
version = "0.1.0"
description = "自然语言设备诊断与 Word 报告 Agent Demo"
requires-python = ">=3.11"
dependencies = ["python-docx>=1.2,<2", "Pillow>=10,<13"]

[project.scripts]
diagnostic-agent = "diagnostic_agent.cli:main"
rag-service = "rag_service.__main__:main"

[tool.setuptools.packages.find]
include = ["diagnostic_agent*", "rag_service*"]

[tool.setuptools.package-data]
diagnostic_agent = ["config/*.json", "assets/*.docx", "assets/*.txt"]

rag_service = ["static/*.html", "static/*.js", "static/*.css"]

[project.optional-dependencies]
rag = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1", "pypdf>=5,<7", "numpy>=1.26,<3", "httpx>=0.27,<1"]
local = ["fastembed>=0.7,<1"]

ocr = ["rapidocr>=3,<4", "onnxruntime>=1.20,<2", "pypdfium2>=4,<6"]
