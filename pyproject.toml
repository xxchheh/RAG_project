[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "professional-knowledge-rag"
version = "0.1.0"
description = "专业文档解析、审核发布与检索问答 RAG 服务"
requires-python = ">=3.11"
dependencies = ["python-docx>=1.2,<2", "Pillow>=10,<13"]

[project.scripts]
rag-service = "rag_service.__main__:main"

[tool.setuptools.packages.find]
include = ["rag_service*"]

[tool.setuptools.package-data]
rag_service = ["static/*.html", "static/*.js", "static/*.css", "assets/*.json", "assets/*.docx"]

[project.optional-dependencies]
rag = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1", "pypdf>=5,<7", "numpy>=1.26,<3", "httpx>=0.27,<1", "rank-bm25==0.2.2", "jieba==0.42.1"]
local = ["fastembed>=0.7,<1"]

ocr = ["rapidocr>=3,<4", "onnxruntime>=1.20,<2", "pypdfium2>=4,<6"]
