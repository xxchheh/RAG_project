name: Agent API contract
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[rag]'
      - name: Check v1 interface compatibility
        run: python -m unittest discover -s tests -p 'test_agent_api_contract.py' -v
